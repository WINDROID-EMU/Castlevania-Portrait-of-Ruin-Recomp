plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retroporting.castlevaniapor'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.retroporting.castlevaniapor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DNDS_BOOTSTRAP_FIRMWARE=ON",
                          "-DNDS_SDL_BACKEND=SDL2",
                          "-DCMAKE_BUILD_TYPE=Release",
                          "-DANDROID_ARM_NEON=TRUE",
                          "-DCMAKE_BUILD_PARALLEL_LEVEL=4"
                cFlags "-w", "-O3", "-fomit-frame-pointer", "-fno-plt", "-fvisibility=hidden"
                cppFlags "-std=c++20", "-w", "-O3", "-fomit-frame-pointer", "-fno-plt", "-fvisibility=hidden", "-fvisibility-inlines-hidden"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
